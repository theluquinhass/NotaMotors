services:
  postgres:
    image: postgres:18-alpine
    container_name: notamotors-postgres
    environment:
      POSTGRES_USER: notamotors
      POSTGRES_PASSWORD: notamotors
      POSTGRES_DB: notamotors
      TZ: UTC
      PGTZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notamotors -d notamotors']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
